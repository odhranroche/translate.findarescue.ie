<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b6e4f" id="themeColor">
<title>Translate</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e4f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css">
</head>
<!--
  Translation portal page. This file contains no language- or project-specific
  wording: the elements marked data-ui* are filled in by assets/portal.js from
  languages/<id>/language.json (see languages/README.md).
-->
<body data-booting>
<a class="skip" href="#list">Skip to translations</a>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3ZM12 10v4M12 17.5v.01"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-party" viewBox="0 0 24 24"><path d="M4 20 9 7l8 8-13 5ZM14 4l1 2M19 9l2-1M17 3l-1 3 3-1M20 13l-2 .5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<header class="appbar">
  <div class="wrap">
    <a class="brand" href="#" data-ui-aria="brandAria">
      <span class="logo" id="logoText" aria-hidden="true"></span>
      <span><b><span class="long" data-ui="brandLong"></span><span class="short" data-ui="brandShort"></span></b><small data-ui="brandSub"></small></span>
    </a>
    <span class="spacer"></span>
    <button class="btn btn-ghost icon-btn" id="helpBtn" title="How it works" aria-label="How it works"><svg class="i"><use href="#i-help"/></svg></button>
    <button class="btn btn-ghost icon-btn" id="resyncBtn" data-ui-title="resyncTitle" data-ui-aria="resyncTitle"><svg class="i"><use href="#i-refresh"/></svg></button>
    <button class="btn btn-secondary" id="exportBtn"><svg class="i"><use href="#i-download"/></svg><span class="hide-sm">Export</span></button>
    <button class="me" id="meBtn" aria-label="Change your name"><span class="avatar" id="meAvatar">?</span><span class="n" id="meName">Set your name</span></button>
  </div>
</header>

<section class="hero" aria-labelledby="heroTitle">
  <div class="wrap">
    <div class="hero-card">
      <div>
        <h1 id="heroTitle" data-ui="heroTitle"></h1>
        <p data-ui="heroText"></p>
      </div>
      <div>
        <div class="progress-top">
          <div class="progress-num"><span id="pDone">–</span><small>of <span id="pTotal">–</span> accepted</small></div>
          <div class="progress-pct" id="pPct"></div>
        </div>
        <div class="bar" role="progressbar" aria-labelledby="heroTitle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pBar"><i></i></div>
        <div class="progress-foot">
          <div class="legend"><span><i class="dot" style="background:var(--primary)"></i>Accepted</span><span><i class="dot" style="background:var(--todo)"></i><span id="pTodo">–</span> to translate</span></div>
          <button class="btn btn-primary btn-sm" id="nextBtn">Next to translate<svg class="i sm"><use href="#i-arrow-right"/></svg></button>
        </div>
      </div>
    </div>
    <div class="banner" id="banner" hidden role="status"><svg class="i"><use href="#i-alert"/></svg><span id="bannerText"></span></div>
  </div>
</section>

<div class="toolbar">
  <div class="wrap">
    <div class="seg" role="group" aria-label="Show">
      <button data-f="todo" aria-pressed="true">To translate <span class="count todo" id="cTodo">–</span></button>
      <button data-f="all" aria-pressed="false">All text <span class="count" id="cAll">–</span></button>
    </div>
    <label class="search">
      <span class="sr-only">Search</span>
      <svg class="i"><use href="#i-search"/></svg>
      <input class="field" id="q" type="search" data-ui-placeholder="searchPlaceholder" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <label class="sr-only" for="section">Page section</label>
    <select class="field" id="section"><option value="">All sections</option></select>
  </div>
</div>

<main id="list" class="wrap" tabindex="-1" aria-live="off">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</main>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<button class="totop" id="totop" aria-label="Back to top"><svg class="i"><use href="#i-arrow-up"/></svg></button>

<!-- Welcome / name -->
<dialog id="welcome" aria-labelledby="wTitle">
  <form class="dlg-body" id="welcomeForm" method="dialog">
    <h2 id="wTitle"></h2>
    <p data-ui="welcomeIntro"></p>
    <ol class="steps">
      <li><span class="ic" style="background:var(--ai-soft);color:var(--ai)"><svg class="i"><use href="#i-spark"/></svg></span><span><b data-ui="welcomeStep1Title"></b><span data-ui="welcomeStep1Text"></span></span></li>
      <li><span class="ic" style="background:var(--primary-soft);color:var(--primary)"><svg class="i"><use href="#i-check"/></svg></span><span><b data-ui="welcomeStep2Title"></b><span data-ui="welcomeStep2Text"></span></span></li>
      <li><span class="ic" style="background:var(--todo-soft);color:var(--todo)"><svg class="i"><use href="#i-plus"/></svg></span><span><b data-ui="welcomeStep3Title"></b><span data-ui="welcomeStep3Text"></span></span></li>
    </ol>
    <label class="label" for="wName">Your name</label>
    <input class="field" id="wName" maxlength="80" autocomplete="name" data-ui-placeholder="namePlaceholder">
    <p class="hint" style="margin:6px 0 0">Shown next to your translations and votes. It's saved in this browser.</p>
    <div class="formerr" id="wErr"></div>
    <div class="dlg-foot"><button type="button" class="btn btn-ghost" id="wCancel" hidden>Cancel</button><button class="btn btn-primary" id="wSubmit">Get started</button></div>
  </form>
</dialog>

<!-- Export -->
<dialog id="exportDlg" aria-labelledby="eTitle">
  <div class="dlg-body">
    <h2 id="eTitle" data-ui="exportTitle"></h2>
    <p data-ui-rich="exportIntro"></p>
    <textarea class="field" id="exportText" readonly data-ui-aria="exportAria"></textarea>
    <div class="dlg-foot">
      <button class="btn btn-ghost" id="eClose">Close</button>
      <button class="btn btn-secondary" id="eDownload"><svg class="i"><use href="#i-download"/></svg>Download</button>
      <button class="btn btn-primary" id="eCopy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
    </div>
  </div>
</dialog>

<noscript><style>body[data-booting]{visibility:visible}</style><p style="padding:24px;text-align:center">This translation tool needs JavaScript.</p></noscript>
<script src="assets/portal.js"></script>
</body>
</html>
